[package]
name = "donate"
version = "0.1.0"
description = "Donate (co-build) program: SOL/Alpha donations → compute-power → weighted Beta rewards, with referral binding and permissionless constrained allocation"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "donate"

[features]
default = []
mainnet-test-10m = ["dex-pool/mainnet-test-10m"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token_2022"] }
spl-token-2022 = { version = "6.0.0", default-features = false, features = ["no-entrypoint"] }
dex-pool = { path = "../dex-pool", features = ["cpi"] }
