[package]
name = "dex-pool"
version = "0.1.0"
description = "Constant-product AMM (x*y=k) with admin buy/sell switches; classic SPL tokens"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "dex_pool"

[features]
default = []
mainnet-test-10m = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = { version = "0.31.1", features = ["token_2022"] }
spl-token-2022 = { version = "6.0.0", default-features = false, features = ["no-entrypoint"] }
